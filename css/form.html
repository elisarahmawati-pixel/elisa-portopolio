<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0"
        <title>Create Account</title>
    
        <style>
            * {
                box-sizing: border-box;
            }


            body {
                margin: 0;
                padding: 30px;
                font-family: Arial, sans-serif;
                background: darkgray;
                color: lightslategrey;
            }


            .container {
                max-width: 850px;
                margin: 0 auto;
                background-color: white;
                border-radius: 12px;
                overflow: hidden;
            }


            .header {
                background: #eef0f3;
                text-align: center;
                padding: 22px;
                border-bottom: 1px solid #ccc;
            }


            .header h1 {
                margin: 0;
                color: #666;
                font-size: 32px;
            }


            form {
                padding: 30px 45px 38px;
            }


            .form-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 22px 14px;
            }


            .form-group {
                min-width: 0;
            }


            .full {
                grid-column: 1 / -1;
            }


            label,
            .group-title {
                display: block;
                color: #20b394;
                font-size: 18px;
                font-weight: bold;
                margin-bottom: 5px;
            }


            input:not([type="radio"]):not([type="checkbox"]):not([type="range"]):not([type="file"])
            select,
            textarea {
                width: 100%;
                padding: 9px 11px;
                border: 1px solid #d3d3d3;
                border-radius: 5px;
                font-size: 16px;
                font-family: inherit;
                color: #444;
                background: white;
            }


            input:focus,
            select:focus,
            textarea:focus {
                outline: none;
                border-color: #20b394;
                box-shadow: 0 0 4px #20b39455;
            }


            .options {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 7px;
            }


            .options label {
                display: inline-flex;
                align-items: center;
                gap: 3px;
                color: #555;
                font-size: 16px;
                font-weight: normal;
                margin: 0;
            }


          input[type="radio"],
        input[type="checkbox"] {
            accent-color: #20b394;
            margin: 0;
        }


        .income-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }


        input[type="range"] {
            flex: 1;
            min-width: 0;
            accent-color: #20b349;
        }


        .income-value {
            background: #20b349;
            color: white;
            padding: 7px 8px;
            border-radius: 8px;
            font-weight: bold;
            min-width: 44px;
            text-align: center;
        }


        input[type="file"] {
            max-width: 100%;
            font-size: 15px;
        }


        textarea {
            min-height: 95px;
            resize: vertical;
        }


        .footer {
            background: #eef0f3;
            padding: 12px 45px;
            display: flex;
            justify-content: flex-end;
            border-top: 1px solid #ccc;            
        }


        button {
            background: #20b349;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
        }


        button:hover {
            background: #15987c;
        }


        @media (max-width: 600px) {
            body {
                padding: 12px;
            }


            .header h1 {
                font-size: 26px;
            }


            form {
                padding: 22px 18px;
            }


            .form-grid {
                grid-template-columns: 1fr;
                gap: 18px;
            }


            .full {
                grid-column: auto;
            }


            .footer {
                padding: 12px 18px;
            }
        }
    </style>
</head>


<body>
    <div class="container">


        <div class="header">
            <h1>Create Account</h1>
        </div>


        <form id="accountForm">
            <div class="form-grid">


                <div class="form-group">
                    <label for="firstName">First name *</label>
                    <input type="text" id="firstName" name="firstName"
                        placeholder="enter your first name" required>
                </div>


                <div class="form-group">
                    <label for="lastName">Last name</label>
                    <input type="text" id="lastName" name="lastName"
                        placeholder="enter your last name">
                </div>


                <div class="form-group full">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email"
                        placeholder="enter your email" required>
                </div>


                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" name="password"
                        placeholder="enter your password" required>
                </div>


                <div class="form-group">
                    <label for="confirmPassword">Confirm Password *</label>
                    <input type="password" id="confirmPassword"
                        name="confirmPassword"
                        placeholder="enter your password again" required>
                </div>


                <div class="form-group">
                    <span class="group-title">Gender:</span>
                    <div class="options">
                        <label>
                            <input type="radio" name="gender" value="Male">
                            Male
                        </label>
                        <label>
                            <input type="radio" name="gender" value="Female">
                            Female
                        </label>
                    </div>
                </div>


                <div class="form-group">
                    <span class="group-title">Hobbies</span>
                    <div class="options">
                        <label>
                            <input type="checkbox" name="hobbies" value="Music">
                            Music
                        </label>
                        <label>
                            <input type="checkbox" name="hobbies" value="Sports">
                            Sports
                        </label>
                        <label>
                            <input type="checkbox" name="hobbies" value="Travel">
                            Travel
                        </label>
                        <label>
                            <input type="checkbox" name="hobbies" value="Movies">
                            Movies
                        </label>
                    </div>
                </div>


                <div class="form-group">
                    <label for="source">Source of Income</label>
                    <select id="source" name="source">
                        <option value="Employed">Employed</option>
                        <option value="Self-employed">Self-employed</option>
                        <option value="Student">Student</option>
                        <option value="Unemployed">Unemployed</option>
                    </select>
                </div>


                <div class="form-group">
                    <label for="income">Income</label>
                    <div class="income-row">
                        <input type="range" id="income" name="income"
                            min="0" max="100000" step="1000" value="20000">
                        <span class="income-value" id="incomeValue">20K</span>
                    </div>
                </div>


                <div class="form-group">
                    <label for="profilePicture">Upload Profile Picture</label>
                    <input type="file" id="profilePicture"
                        name="profilePicture" accept="image/*">
                </div>


                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age"
                        min="1" max="120" value="18">
                </div>


                <div class="form-group full">
                    <label for="bio">Bio</label>
                    <textarea id="bio" name="bio"></textarea>
                </div>


            </div>
        </form>


        <div class="footer">
            <button type="submit" form="accountForm">Create</button>
        </div>


    </div>


    <script>
        const income = document.getElementById("income");
        const incomeValue = document.getElementById("incomeValue");
        const form = document.getElementById("accountForm");


        function updateIncome() {
            const value = Number(income.value);


            incomeValue.textContent = value >= 1000
                ? (value / 1000) + "K"
                : value;
        }


        income.addEventListener("input", updateIncome);


        form.addEventListener("submit", function(event) {
            event.preventDefault();


            const password = document.getElementById("password").value;
            const confirmPassword =
                document.getElementById("confirmPassword").value;


            if (password !== confirmPassword) {
                alert("Password dan konfirmasi password tidak sama!");
                return;
            }


            alert("Form Create Account berhasil diisi!");
        });


        updateIncome();
    </script>
</body>
</html>
